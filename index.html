<script>
const KEY='lokal-v1';

const SEED={"pin": "1234", "aidat": 500, "open": 0, "cats": ["Elektrik", "Digiturk", "Temizlik", "Malzeme", "Tamir", "Diğer", "Bağış"], "drinks": [["3ua2pxb", "Türk kahvesi", 50], ["50eijpb", "Kahve Çeşitleri Nespresso", 30], ["0ftibbr", "Soda", 20], ["mzw56m3", "Cola, sprite, Fanta", 40], ["o8ykihh", "Su", 10], ["ncjptrg", "Meyve suyu şişe", 40], ["6vupm2g", "Perge sarı", 80], ["asgvp1m", "Miller şişe", 130], ["yrfrfnl", "Carlsberg şişe", 120], ["crli8y1", "Bud şişe", 140], ["9gpg7mr", "Tuborg şişe", 110], ["4d7zzm1", "Heineken şişe", 150]], "members": [["nut4ntq", "BORA", 0], ["rt1tb3p", "CENK", 0], ["y3igwt4", "ERCAN", 0], ["wad6z7h", "GÜVEN", 0], ["rnoxzvx", "KORAY", 0], ["eqi5mde", "CUMHUR", 0], ["psddyjy", "CEM", 0], ["wbhg4i1", "BARIŞ", 0], ["pz86aa7", "KUTAY", 1], ["r59a708", "NAZMİ", 0], ["cdv2wbu", "HANE", 1], ["cvn383d", "MİSAFİR", 1]]};

 members:SEED.members.map(x=>{const m={id:x[0],name:x[1]};if(x[2])m.noDues=true;return m}),

 entries:[],aidat:SEED.aidat,dues:{},cash:[],open:SEED.open,cats:SEED.cats.slice()});

try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}

function tickTxt(){const d0=new Date();d0.setHours(0,0,0,0);const c={};let n=0;
 const P=[];S.entries.filter(e=>e.q&&e.t>=+d0).sort((a,b)=>b.t-a.t).forEach(e=>{const m=S.members.find(x=>x.id===e.m);P.push('🎁 '+(m?m.name:'Biri')+' herkese '+e.d+' ısmarladı!')});
 S.entries.forEach(e=>{if(!e.k&&e.p>0&&e.t>=+d0){c[e.d]=(c[e.d]||0)+(e.q||1);n++}});
 if(n){P.push('🔥 Bugün Hane’de '+Object.entries(c).sort((a,b)=>b[1]-a[1]).map(x=>x[1]+' '+x[0]).join(' · ')+' içildi')}
 else P.push('☕ Bugün henüz kimse bir şey içmedi, ilk sen ol!');
 return P.join('     •     ')}
function tickDraw(){const w=document.getElementById('tick');if(!w)return;const on=view==='home';w.hidden=!on;if(!on)return;const t=tickTxt();if(w.dataset.t===t)return;w.dataset.t=t;const k=w.firstChild;k.innerHTML='<span>'+esc(t)+'</span><span aria-hidden="true">'+esc(t)+'</span>';k.style.animationDuration='14s'}
function kasaTot(){const inc=-S.entries.filter(e=>e.k==='pay').reduce((s,e)=>s+e.p,0),aid=Object.values(S.dues).reduce((s,r)=>s+r.a,0),oth=S.cash.filter(x=>x.k==='in').reduce((s,x)=>s+x.a,0),exp=S.cash.filter(x=>x.k==='out').reduce((s,x)=>s+x.a,0);return S.open+inc+aid+oth-exp}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const bal=m=>open_(m).reduce((a,e)=>a+e.p,0);

function tone(f,t0,d,v){try{
 AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 if(AC.state==='suspended')AC.resume();
 const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
 o.type='sine';o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02)}catch(e){}}
const SB={},SEQ={tick:[[520,0,.06,.5]],add:[[660,0,.1,.6],[880,.08,.15,.6]],ok:[[523,0,.12,.6],[659,.09,.12,.6],[784,.18,.2,.6]],bad:[[180,0,.25,.7]]};
function mkWav(seq){const R=22050;let n=0;seq.forEach(s=>{n=Math.max(n,Math.floor((s[1]+s[2])*R))});
 const buf=new ArrayBuffer(44+n*2),v=new DataView(buf),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,R,true);v.setUint32(28,R*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 const d=new Float32Array(n);
 seq.forEach(([f,t0,du,a])=>{const s0=Math.floor(t0*R),l=Math.floor(du*R);for(let i=0;i<l&&s0+i<n;i++){const e=Math.min(1,i/(R*0.005))*Math.pow(1-i/l,2);d[s0+i]+=Math.sin(2*Math.PI*f*i/R)*a*e}});
 for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,d[i]))*32767,true);
 const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);
 return 'data:audio/wav;base64,'+btoa(s)}
function snd(k){if(!SND)return;try{
 const key=SEQ[k]?k:'tick';
 if(!SB[key])SB[key]=mkWav(SEQ[key]);
 const a=new Audio(SB[key]);a.volume=1;const p=a.play();if(p&&p.catch)p.catch(()=>snd2(k))}catch(e){snd2(k)}}
function snd2(k){
 if(k==='add'){tone(660,0,.09,.25);tone(880,.08,.14,.25)}
 else if(k==='ok'){tone(523,0,.1,.25);tone(659,.09,.1,.25);tone(784,.18,.18,.25)}
 else if(k==='bad'){tone(180,0,.22,.3)}
 else tone(520,0,.05,.15)}

})}

function shop(){
 const DAY=86400000,now=Date.now(),cons=S.entries.filter(x=>x.k!=='pay'&&x.t<=now);
 const first=cons.reduce((m,x)=>Math.min(m,x.t),now),from=Math.max(first,now-28*DAY);
 const days=Math.max(1,Math.min(28,Math.ceil((now-from)/DAY))),win=cons.filter(x=>x.t>=now-28*DAY);
 const cnt={};win.forEach(x=>{cnt[x.d]=(cnt[x.d]||0)+1});
 const rows=S.drinks.filter(d=>cnt[d.name]).map(d=>{const c=cnt[d.name],need=Math.ceil(c/days*SP);return{n:d.name,c:c,need:need,buy:Math.max(0,need-(HAVE[d.name]||0))}}).sort((x,y)=>y.need-x.need);
 const DN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'],wd=[0,0,0,0,0,0,0],hr=new Array(24).fill(0);
 cons.filter(x=>x.t>=now-56*DAY).forEach(x=>{const t=new Date(x.t);wd[t.getDay()]++;hr[t.getHours()]++});
 let day='',hour='';
 if(wd.some(n=>n)){day=DN[wd.indexOf(Math.max.apply(null,wd))];
  let bh=0,bs=-1;for(let h=0;h<24;h++){const s=hr[h]+hr[(h+1)%24];if(s>bs){bs=s;bh=h}}
  hour=String(bh).padStart(2,'0')+':00 – '+String((bh+2)%24).padStart(2,'0')+':00'}
 return{days:days,few:cons.length>0&&days<5,rows:rows,tot:rows.reduce((s,r)=>s+r.buy,0),day:day,hour:hour}}

  nm=id=>(S.members.find(m=>m.id===id)||{name:'?'}).name,L=[['Üye','Tüketim','Ödenen'].map(q).join(';')];
 R.mm.forEach(x=>L.push([q(x.n),n(x.t),n(x.pay)].join(';')));
 L.push('',['Tarih','Üye','Kalem','Tutar'].map(q).join(';'));
 R.es.forEach(x=>L.push([q(when(x.t)),q(nm(x.m)),q(x.d),n(x.p)].join(';')));
 L.push('',['Özet','Tutar'].map(q).join(';'));
 [['İçecek hesaplarından alınan ödemeler',R.pay],['Aidat tahsilatı',R.aid],['Diğer gelirler',R.oth],['Masraflar',R.exp],['Aylık net',R.pay+R.aid+R.oth-R.exp]].forEach(x=>L.push([q(x[0]),n(x[1])].join(';')));
 L.push('',['Tarih','Tür','Açıklama','Tutar'].map(q).join(';'));
 R.cx.forEach(x=>L.push([q(when(x.t)),q(x.k==='out'?'Masraf':'Gelir'),q(x.d),n(x.a)].join(';')));
 const fn='hane-'+rY+'-'+String(rM+1).padStart(2,'0')+'.csv',txt=String.fromCharCode(65279)+L.join(String.fromCharCode(13,10));
 try{const bl=new Blob([txt],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=fn;a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000);toast('Dosya hazırlandı')}
 catch(e){try{window.open('data:text/csv;charset=utf-8,'+encodeURIComponent(txt),'_blank')}catch(e2){toast('Dosya kaydedilmedi')}}}

let errShown=false;
function dbErr(e){netErr(e);if(errShown)return;errShown=true;setTimeout(()=>{errShown=false},15000);
 toast(e&&e.code==='permission-denied'?'Sunucu izin vermedi (Firestore kuralları)':'Sunucuya bağlanılamadı, yeniden deneniyor')}
const NET={pend:false,cache:true,err:0,code:''};
function netErr(e){NET.err=Date.now();NET.code=e&&e.code||'';netDraw();setTimeout(netDraw,15500)}
function netState(){
 if(!navigator.onLine)return['bad','İnternet yok','Cihazın internet bağlantısı yok. Yazılanlar cihazda bekliyor, bağlantı gelince sunucuya gidecek. Sayfayı yenileme.'];
 if(Date.now()-NET.err<15000)return['bad',NET.code==='permission-denied'?'Sunucu izin vermedi':'Sunucu hatası','Sunucuya yazarken hata oldu'+(NET.code?' ('+NET.code+')':'')+'. Tekrar denenecek.'];
 if(!DB)return['wait','Bağlanıyor…','Sunucuya bağlanılıyor.'];
 if(NET.pend)return['wait','Kaydediliyor…','Son yazılanlar sunucuya gönderiliyor. Sayfayı yenileme.'];
 if(NET.cache)return['wait','Bağlanıyor…','İnternet var ama sunucuyla bağlantı henüz kurulmadı.'];
 return['ok','Bağlı','Her şey yolunda: kayıtlar sunucuya gidiyor ve diğer cihazlarla eşleşiyor.']}
function netDraw(){const el=document.getElementById('net');if(!el)return;const s=netState();el.className=s[0];el.querySelector('span').textContent=s[1]}
window.addEventListener('online',netDraw);window.addEventListener('offline',netDraw);setInterval(netDraw,5000);setInterval(tickDraw,60000);
async function initDb(){try{
 if(!window.firebase)throw new Error('sdk');
 if(!firebase.apps.length){firebase.initializeApp(FBCFG);
  try{firebase.firestore().settings({experimentalAutoDetectLongPolling:true,ignoreUndefinedProperties:true,merge:true})}catch(e){}
  try{await Promise.race([firebase.firestore().enablePersistence({synchronizeTabs:true}),new Promise(r=>setTimeout(r,4000))])}catch(e){console.warn('persist',e&&e.code)}}
 const c=firebase.firestore(),cd=c.doc('cfg/main'),first=await cd.get();
 if(!first.exists){await cd.set({pin:S.pin,members:S.members,drinks:S.drinks,aidat:S.aidat,dues:S.dues,open:S.open,cats:S.cats});for(const e of S.entries)await c.collection('entries').doc(e.id).set(e)}
 DB=c;
 cd.onSnapshot(sn=>{if(!sn.exists)return;const d=JSON.parse(JSON.stringify(sn.data()));S.pin=d.pin;S.members=d.members;S.drinks=d.drinks;S.aidat=d.aidat||0;S.dues=d.dues||{};S.open=d.open||0;S.cats=Array.isArray(d.cats)?d.cats:CATS0.slice();save();if(!typing())render()},dbErr);
 DB.collection('entries').onSnapshot(q=>{S.entries=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));save();treatWatch();if(!typing())render()},dbErr);
 const mt={};['cfg','entries','cash'].forEach(k=>{(k==='cfg'?cd:DB.collection(k)).onSnapshot({includeMetadataChanges:true},s=>{mt[k]=s.metadata;NET.pend=Object.keys(mt).some(x=>mt[x].hasPendingWrites);NET.cache=Object.keys(mt).some(x=>mt[x].fromCache);netDraw()},()=>{})});
 DB.collection('cash').onSnapshot(q=>{S.cash=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));save();if(!typing())render()},dbErr);
 render();

initDb();
render();
